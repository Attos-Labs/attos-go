name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        # Golden-fixture tests skip with a message when GOLDEN_DIR is absent
        # (the golden fixtures are not part of this repository).
        run: go test -race -count=1 ./...
      - name: Lookup benchmark (0 B/op, 0 allocs/op)
        run: go test -run '^$' -bench=BenchmarkLookup -benchmem -count=1 .
